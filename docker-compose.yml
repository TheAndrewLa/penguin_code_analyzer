services:
  instruction_service:
    build:
      context: ./backend/instruction_service
      dockerfile: Dockerfile
    image: instruction_service:latest
    container_name: instruction_service
    restart: unless-stopped
    expose:
      - "${PORT_INSTRUCTION_SERVICE}"
    command: ["--port", "${PORT_INSTRUCTION_SERVICE}"]
    networks:
      - services

  simulate_service:
    build:
      context: ./backend/simulate_service
      dockerfile: Dockerfile
    image: simulate_service:latest
    container_name: simulate_service
    restart: unless-stopped
    expose:
      - "${PORT_SIMULATE_SERVICE}"
    command: ["--port", "${PORT_SIMULATE_SERVICE}"]
    networks:
      - services

  graph_service:
    build:
      context: ./backend/graph_service
      dockerfile: Dockerfile
    image: graph_service:latest
    container_name: graph_service
    restart: unless-stopped
    expose:
      - "${PORT_GRAPH_SERVICE}"
    command: ["--port", "${PORT_GRAPH_SERVICE}"]
    networks:
      - services

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: frontend:latest
    container_name: frontend
    restart: unless-stopped
    expose:
      - "${PORT_BFF}"
    command: []
    networks:
      - services

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - services

volumes:
  caddy_data:
  caddy_config:

networks:
  services:
    driver: bridge
