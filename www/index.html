<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Penguin · Code Analyzer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/eclipse.min.css">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="top-bar">
        <div class="logo-area">
            <div class="logo-penguin">Penguin</div>
            <div class="logo-sub">code analyzer</div>
        </div>
        <div class="top-actions">
            <button class="secondary" id="saveBtn">Save<i class="fa-solid fa-download"></i></button>
            <button class="secondary" id="shareBtn">Share<i class="fa-solid fa-share-nodes"></i></button>
        </div>
    </div>

    <div class="main-container">
        <div class="left-panel">
            <div class="toolbar">
                <div class="tab-bar" id="tabBar">
                </div>
                <div class="source-menu" id="sourceMenu" style="display:none;">
                    <div class="menu-item" data-type="c">C</div>
                    <div class="menu-item" data-type="cpp">C++</div>
                    <div class="menu-item" data-type="asm">Assembly</div>
                    <div class="menu-item" data-type="binary">Binary (upload)</div>
                </div>
                <div class="toolbar-group">
                    <select id="compilerSelect">
                        <option>gcc 13.2</option>
                        <option>clang 17.0</option>
                    </select>
                </div>
                <button class="secondary" id="compileBtn"><i class="fa-solid fa-caret-right"></i></button>
            </div>
            <div class="editor-wrapper" id="editorWrapper">
            </div>
            <input type="file" id="fileInput" accept=".c,.cpp,.h,.s,.asm,.bin" style="display:none;">
        </div>

        <div class="right-panel">
            <div class="toolbar">
                <select id="functionSelect" class="function-select">
                    <option selected>fib(int)</option>
                </select>
                <div class="graph-actions">
                    <button class="secondary" id="analyzeBtn">Analyze</button>
                    <button class="secondary" id="simulateBtn">Simulate</button>
                    <div class="zoom-controls">
                        <button class="secondary zoom-btn" id="zoomOutBtn" title="Zoom out">-</button>
                        <button class="secondary zoom-btn" id="zoomLevel">100%</button>
                        <button class="secondary zoom-btn" id="zoomInBtn" title="Zoom in">+</button>
                    </div>
                </div>
            </div>
            <div class="graph-container" id="graphContainer">
                <canvas id="cfgCanvas"></canvas>
            </div>
        </div>
    </div>

    <div id="insnTooltip" class="tooltip" style="display:none;"></div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="modal-close" id="closeModalBtn">&times;</button>
            <h3>Intel® 64 and IA-32 Architectures</h3>
            <div id="modalContent">
                <strong>Instruction reference</strong>
                <pre id="modalPre"></pre>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/gas/gas.min.js"></script>
    <script src="index.js"></script>
</body>

</html>
